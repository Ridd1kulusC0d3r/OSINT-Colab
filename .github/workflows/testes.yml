name: testes
on: [push, pull_request]
jobs:
  nucleo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testes do núcleo (só stdlib)
        run: python -m unittest discover -s testes -v
      - name: Notebooks atualizados com o gerador
        run: |
          python ferramentas/gerar_notebooks.py
          git diff --exit-code notebooks/
      - name: Validar notebooks e executar o 00
        run: python ferramentas/validar_notebooks.py
